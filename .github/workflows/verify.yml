name: Verify MosaicGuard
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      graph:
        image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        ports: ["6397:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock
      - run: python scripts/configure.py
      - name: Use the isolated CI graph
        run: |
          echo 'MOSAIC_GRAPH_PASSWORD=' >> "$GITHUB_ENV"
      - run: .venv/bin/python -m pytest backend/tests -q --junitxml=docs/junit.xml
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-verification
          path: |
            docs/junit.xml
            docs/browser-results.json
            docs/screenshots
